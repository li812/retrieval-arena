name: CI

on:
  push:
    branches: [main, dev-beta, platform]
  pull_request:
    branches: [main, dev-beta, platform]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations on a fresh database
        run: |
          alembic -x db_path="$RUNNER_TEMP/ci.db" upgrade head
          alembic -x db_path="$RUNNER_TEMP/ci.db" check
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t retrieval-arena:ci .
      - name: Smoke test
        run: |
          docker run -d --name arena -p 8000:8000 retrieval-arena:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/app/ | grep -qi '<div id="root"'
          curl -fsS -o /dev/null http://localhost:8000/
          docker logs arena
