name: retrieval-arena

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
    healthcheck:
      test: ["CMD", "bash", "-c", ">/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/playground123}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:7474/ -O /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    # Multi-stage build: the React app is built in a node stage and served by the api at /app/
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Live backend code (restart api after Python changes). Whole directories, not single files:
      # editors that replace a file would otherwise orphan the mount
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      # Keep the vendor assets fetched at build time visible under the bind mount above
      - /app/backend/app/static/vendor
      # Data volume: keep this mount point; ARENA_DB_PATH below is absolute and points into it
      - arena_data:/app/arena_data
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-playground123}"
      ARENA_DB_PATH: "/app/arena_data/arena.db"
      ARENA_SPA_DIR: "/app/frontend_dist"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      chromadb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/backend/app
          ignore:
            - static/vendor/
        - action: rebuild
          path: ./backend/pyproject.toml

  # Frontend dev server with hot reload, nothing installed on the host:
  #   docker compose --profile dev up      → http://localhost:5173/app/
  # Vite proxies API calls to the api container (VITE_PROXY_TARGET).
  web:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      # Linux node_modules stay in a volume, never on the host
      - web_node_modules:/web/node_modules
    environment:
      VITE_PROXY_TARGET: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
  neo4j_data:
  arena_data:
  web_node_modules:
