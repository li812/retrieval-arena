name: retrieval-arena

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
    healthcheck:
      test: ["CMD", "bash", "-c", ">/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/playground123}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:7474/ -O /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app/main.py:/app/app/main.py
      - ./app/config.py:/app/app/config.py
      - ./app/schemas.py:/app/app/schemas.py
      - ./app/services:/app/app/services
      - ./app/static/index.html:/app/app/static/index.html
      - ./app/static/app.js:/app/app/static/app.js
      - ./app/static/style.css:/app/app/static/style.css
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-playground123}"
    depends_on:
      chromadb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - static/vendor/

volumes:
  chroma_data:
  neo4j_data:
